[project]
name = "p2pact"
version = "0.1.0"
description = "Python implementation of P2PACT — the P2P Agent Chat Transport Protocol: chat with your AI agents across your own devices, no servers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "zstandard>=0.22"]
keywords = ["p2p", "ai-agents", "chat", "protocol", "noise", "cbor"]

[project.urls]
Homepage = "https://github.com/p2pact/p2pact"
Repository = "https://github.com/p2pact/p2pact-py"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["p2pact"]

[tool.setuptools.package-data]
p2pact = ["*.zdict"]
