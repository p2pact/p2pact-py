[project]
name = "p2pact"
version = "0.1.0"
description = "Python implementation of P2PACT — the P2P Agent Chat Transport Protocol: chat with your AI agents, no servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aidar Babanov" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "zstandard>=0.22"]
keywords = ["p2p", "ai-agents", "agent", "chat", "protocol", "noise", "cbor", "zstd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/p2pact/p2pact"
Repository = "https://github.com/p2pact/p2pact-py"
Issues = "https://github.com/p2pact/p2pact-py/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["p2pact", "p2pact.client"]

[tool.setuptools.package-data]
p2pact = ["*.zdict"]
